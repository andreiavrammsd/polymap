name: bazel

on:
  push:

jobs:
  bazel:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: bazel

      - name: Run tests with coverage
        run: bazel coverage --combined_report=lcov poly_map_test --test_output=all

      - name: Coverage
        run: |
          sudo apt install -y lcov \
          && lcov --capture --directory $(bazel info bazel-testlogs)/poly_map_test/ --output-file coverage.info

      - name: Prepare coverage report
        run: |
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
